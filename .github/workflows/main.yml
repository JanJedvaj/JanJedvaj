name: Generate Datas
on:
  schedule: # every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      # Pacman Animation (writes dist/pacman-contribution-graph.svg and -dark.svg)
      - uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: JanJedvaj

      # Publishes everything in dist/ to the output branch (replaces it each run)
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
